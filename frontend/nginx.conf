# SPA Vue Router (mode history) : toute route inconnue de Nginx doit retomber
# sur index.html pour laisser Vue Router décider — sans quoi un rechargement
# de page sur une route comme /risques renvoie une 404 Nginx au lieu de l'écran.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers immuables (noms de build hachés par Vite) : cache long côté
    # navigateur, sans risque de servir une ancienne version après déploiement
    # puisque index.html (jamais mis en cache ci-dessus) référence toujours
    # les bons noms de fichiers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
